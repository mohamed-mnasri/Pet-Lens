<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetLens Live</title>
<style>
  :root {
    --bg: #FAF7F2; --card: #FFFFFF; --ink: #2B2620; --muted: #6B6459;
    --accent: #C8562A; --line: #E7DFD3; --ok: #2F7D4F; --warn: #A86B12;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1C1916; --card: #26221E; --ink: #F1EBE2; --muted: #B3A99B; --line: #3A342D; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.8rem; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 20px; }
  .stage { position: relative; background: #000; border-radius: 12px; overflow: hidden;
           aspect-ratio: 4 / 3; width: 100%; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* Boxes are HTML laid over the picture area of the video, so text stays sharp. */
  #overlay { position: absolute; pointer-events: none; container-type: inline-size;
             color: #fff; font-size: clamp(11px, 2.1cqw, 15px); line-height: 1.25; }
  .box { position: absolute; border: 2px solid rgba(255, 255, 255, .9); border-radius: 16px;
         box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); transition: left .2s, top .2s, width .2s, height .2s, border-color .35s; }
  .box.unknown { border-color: rgba(255, 255, 255, .55); border-style: dashed; }
  .box.locked { border-color: #3DDC84; }
  .box .info { position: absolute; left: 3%; bottom: 4%; width: min(52%, 340px); min-width: 170px;
               background: rgba(18, 20, 19, .62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
               border-radius: 12px; padding: .8em .95em .85em; display: grid; gap: .35em; }
  .box .eyebrow { display: flex; align-items: center; gap: .4em; font-size: .72em; font-weight: 600;
                  letter-spacing: .09em; text-transform: uppercase; color: rgba(255, 255, 255, .6); }
  .box.locked .eyebrow { color: #3DDC84; }
  .box .lock { width: 1.1em; height: 1.1em; flex: none; }
  .box:not(.locked) .lock { display: none; }
  .box .row { display: flex; align-items: baseline; justify-content: space-between; gap: .6em; }
  .box .main { font-weight: 600; font-size: 1.12em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .box .main small { display: block; font-weight: 400; font-size: .72em; color: rgba(255, 255, 255, .6); }
  .box .pct { font-size: 1.15em; font-weight: 600; font-variant-numeric: tabular-nums; }
  .box .meter { position: relative; height: .32em; border-radius: 99px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .box .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: #C9D1CC;
                transition: width .45s ease, background-color .35s; }
  .box.candidate .meter i { background: #FFC857; }
  .box.locked .meter i { background: #3DDC84; }
  .box .meter b { position: absolute; top: -2px; bottom: -2px; left: 75%; width: 1.5px; background: rgba(255, 255, 255, .7); }
  .box .alt { font-size: .82em; color: rgba(255, 255, 255, .6); }
  @media (prefers-reduced-motion: reduce) { .box, .box .meter i { transition: none; } }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: flex; gap: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); }
  #answers { display: grid; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 14px; }
  .card small { color: var(--muted); }
  #msg { color: var(--warn); min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>🐾 PetLens Live</h1>
  <p class="sub">Point your webcam at a cat or dog. Answers are averaged over the last few
    frames. Nothing is recorded: at most one frame every 10 seconds is kept while an animal
    is in view.</p>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay"></div>
  </div>
  <div class="bar">
    <button id="start" class="primary">Start camera</button>
    <button id="stop" disabled>Stop</button>
    <div class="stats">
      <span>FPS <b id="fps">0.0</b></span>
      <span>Round trip <b id="rtt">–</b></span>
      <span>Model <b id="model">–</b></span>
    </div>
  </div>
  <p id="msg"></p>
  <div id="answers"></div>
</main>
<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const grab = document.createElement("canvas");
const session = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
let running = false;
let stream = null;
const times = [];

function label(a) {
  if (a.outcome === "accept") {
    const pct = `${(a.confidence * 100).toFixed(0)}%`;
    return `${a.locked ? "🔒 " : ""}${a.label}${a.also ? " or " + a.also : ""} ${pct}`;
  }
  if (a.outcome === "no_clear_breed") {
    return a.species === "cat" ? "Domestic cat, no clear breed" : "Dog, no clear breed";
  }
  return `Not sure (${a.species})`;
}

const LOCK = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
const boxes = new Map();  // track id -> box element, reused so bars animate between frames

function placeOverlay() {
  // The video is letterboxed (object-fit: contain): cover only the picture area.
  const sw = video.clientWidth, sh = video.clientHeight;
  const vw = video.videoWidth || sw, vh = video.videoHeight || sh;
  const k = Math.min(sw / vw, sh / vh);
  Object.assign(overlay.style, {
    width: `${vw * k}px`, height: `${vh * k}px`,
    left: `${(sw - vw * k) / 2}px`, top: `${(sh - vh * k) / 2}px`,
  });
}

function boxFor(track) {
  let el = boxes.get(track);
  if (!el) {
    el = document.createElement("div");
    el.innerHTML = `<div class="info"><div class="eyebrow">${LOCK}<span class="sp"></span></div>
      <div class="row"><div class="main"><span class="name"></span><small></small></div><span class="pct"></span></div>
      <div class="meter"><i></i><b></b></div><div class="alt"></div></div>`;
    overlay.append(el);
    boxes.set(track, el);
  }
  return el;
}

function drawBox(a) {
  const el = boxFor(a.track);
  const state = a.outcome !== "accept" ? "unknown" : a.locked ? "locked" : "candidate";
  el.className = `box ${state}`;
  const [x0, y0, x1, y1] = a.box;
  Object.assign(el.style, { left: `${x0 * 100}%`, top: `${y0 * 100}%`,
    width: `${(x1 - x0) * 100}%`, height: `${(y1 - y0) * 100}%` });
  const species = a.species === "cat" ? "Cat" : a.species === "dog" ? "Dog" : a.species;
  const best = a.top3[0];
  const breed = (t) => t && t.label !== "Domestic cat";
  let name, sub, pct = "", fill, alt;
  if (state === "unknown") {
    name = a.outcome === "review" ? "Not sure yet" : "No clear breed";
    sub = breed(best) ? `closest: ${best.label}` : "";
    fill = best ? best.p : 0;
    alt = "Keep the animal in view for a clearer answer";
  } else {
    name = a.label;
    sub = a.locked ? "looks most like" : "looks most like, still checking";
    pct = `${(a.confidence * 100).toFixed(0)}%`;
    fill = a.confidence;
    const next = a.also ? a.top3.find((t) => t.label === a.also) : a.top3.find((t) => t.label !== a.label && breed(t));
    alt = next ? `${a.also ? "Close to" : "Next"}: ${next.label} ${(next.p * 100).toFixed(0)}%` : "";
  }
  el.querySelector(".sp").textContent = `${species} · ${a.frames} frame${a.frames === 1 ? "" : "s"}`;
  el.querySelector(".name").textContent = name;
  el.querySelector(".main small").textContent = sub;
  el.querySelector(".pct").textContent = pct;
  el.querySelector(".meter i").style.width = `${Math.round(fill * 100)}%`;
  el.querySelector(".alt").textContent = alt;
  el.querySelector(".alt").hidden = !alt;
}

function clearBoxes() {
  boxes.forEach((el) => el.remove());
  boxes.clear();
}

function draw(animals) {
  placeOverlay();
  const seen = new Set(animals.map((a) => a.track));
  for (const [track, el] of boxes) if (!seen.has(track)) { el.remove(); boxes.delete(track); }
  animals.forEach(drawBox);
  const list = document.getElementById("answers");
  list.replaceChildren(...animals.map((a) => {
    const div = document.createElement("div");
    div.className = "card";
    const top = a.top3.map((t) => `${t.label} ${(t.p * 100).toFixed(0)}%`).join(", ");
    div.innerHTML = `<b></b><br><small></small>`;
    div.querySelector("b").textContent = label(a);
    div.querySelector("small").textContent =
      `Animal ${a.track + 1} · averaged over ${a.frames} frame${a.frames === 1 ? "" : "s"} · top 3: ${top}`;
    return div;
  }));
}

async function loop() {
  while (running) {
    if (!video.videoWidth) { await new Promise((r) => setTimeout(r, 100)); continue; }
    const scale = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
    grab.width = Math.round(video.videoWidth * scale);
    grab.height = Math.round(video.videoHeight * scale);
    grab.getContext("2d").drawImage(video, 0, 0, grab.width, grab.height);
    const blob = await new Promise((r) => grab.toBlob(r, "image/jpeg", 0.85));
    const form = new FormData();
    form.append("file", blob, "frame.jpg");
    form.append("session", session);
    const started = performance.now();
    try {
      const res = await fetch("/live/frame", { method: "POST", body: form });
      const body = await res.json();
      if (!res.ok) {
        document.getElementById("msg").textContent = body.detail || "The API refused the frame.";
        await new Promise((r) => setTimeout(r, 2000));
        continue;
      }
      document.getElementById("msg").textContent = body.animals.length ? "" : "No cat or dog in view.";
      draw(body.animals);
      document.getElementById("model").textContent = `${(body.seconds * 1000).toFixed(0)} ms`;
    } catch (err) {
      document.getElementById("msg").textContent = "The API isn't answering. Is make api running?";
      await new Promise((r) => setTimeout(r, 2000));
    }
    const now = performance.now();
    document.getElementById("rtt").textContent = `${(now - started).toFixed(0)} ms`;
    times.push(now);
    while (times.length > 30) times.shift();
    if (times.length > 1) {
      const fps = (times.length - 1) / ((times[times.length - 1] - times[0]) / 1000);
      document.getElementById("fps").textContent = fps.toFixed(1);
    }
  }
}

window.addEventListener("resize", placeOverlay);

document.getElementById("start").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  } catch (err) {
    document.getElementById("msg").textContent = "No camera access: " + err.message;
    return;
  }
  video.srcObject = stream;
  running = true;
  document.getElementById("start").disabled = true;
  document.getElementById("stop").disabled = false;
  loop();
};

document.getElementById("stop").onclick = () => {
  running = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  clearBoxes();
  document.getElementById("start").disabled = false;
  document.getElementById("stop").disabled = true;
};
</script>
</body>
</html>
