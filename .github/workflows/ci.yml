name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: petlens
          POSTGRES_PASSWORD: petlens
          POSTGRES_DB: petlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petlens -d petlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://petlens:petlens@localhost:5432/petlens
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Enable pgvector
        run: |
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=petlens psql -h localhost -U petlens -d petlens -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest
