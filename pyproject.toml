[project]
name = "petlens"
version = "0.1.0"
description = "Local pet breed recognition that knows when it does not know, with a human review loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
    "pyarrow>=26.0.1",
    "numpy>=2.5.5",
    "truststore>=0.10.5",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
ml = [
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "joblib", "timm", "timm.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs a running Postgres (set DATABASE_URL)"]
