[project]
name = "petlens"
version = "0.1.0"
description = "Local pet breed recognition that knows when it does not know, with a human review loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
    "pyarrow>=26.0.1",
    "numpy>=2.5.5",
    "truststore>=0.10.5",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "av>=19.0.2",
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
    "pgvector>=0.5.1",
]

[project.optional-dependencies]
ml = [
    "rfdetr>=1.12.1",
    "timm>=1.0.31",
    # Floors match the newest CUDA 12.6 wheels for Windows (see [tool.uv.sources]).
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261122",
]

# PyPI's Windows torch wheels are CPU-only. On Windows take CUDA 12.6 builds (works with
# NVIDIA drivers that support CUDA 12.6+); Linux and CI keep the PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "joblib", "timm", "timm.*", "torch", "torch.*", "rfdetr", "rfdetr.*", "av", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs a running Postgres (set DATABASE_URL)"]
