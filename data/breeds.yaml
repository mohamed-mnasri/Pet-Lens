# Label catalogue for PetLens. Every label the pipeline uses must be listed here.
#
# role:
#   train    - a class the per-species head is trained on
#   unknown  - a real breed kept out of training, used only for the unknown-breed test
#
# oxford_label: the breed prefix used in Oxford-IIIT Pet file names, if the breed is in Oxford.
# commons_categories: Wikimedia Commons categories used as weak labels (cats only for now).

breeds:
  # Cats: the 12 Oxford breeds
  - {id: abyssinian, name: Abyssinian, species: cat, role: train, oxford_label: Abyssinian, commons_categories: [Abyssinian cats]}
  - {id: bengal, name: Bengal, species: cat, role: train, oxford_label: Bengal, commons_categories: [Bengal cats]}
  - {id: birman, name: Birman, species: cat, role: train, oxford_label: Birman, commons_categories: [Birman cats]}
  - {id: bombay, name: Bombay, species: cat, role: unknown, oxford_label: Bombay, commons_categories: [Bombay cats]}
  - {id: british_shorthair, name: British Shorthair, species: cat, role: train, oxford_label: British_Shorthair, commons_categories: [British Shorthair cats]}
  - {id: egyptian_mau, name: Egyptian Mau, species: cat, role: train, oxford_label: Egyptian_Mau, commons_categories: [Egyptian Mau]}
  - {id: maine_coon, name: Maine Coon, species: cat, role: train, oxford_label: Maine_Coon, commons_categories: [Maine Coon cats]}
  - {id: persian, name: Persian, species: cat, role: train, oxford_label: Persian, commons_categories: [Persian cats]}
  - {id: ragdoll, name: Ragdoll, species: cat, role: train, oxford_label: Ragdoll, commons_categories: [Ragdoll cats]}
  - {id: russian_blue, name: Russian Blue, species: cat, role: train, oxford_label: Russian_Blue, commons_categories: [Russian Blue cats]}
  - {id: siamese, name: Siamese, species: cat, role: train, oxford_label: Siamese, commons_categories: [Siamese cats]}
  - {id: sphynx, name: Sphynx, species: cat, role: train, oxford_label: Sphynx, commons_categories: [Sphynx (cat)]}

  # Cats: the domestic class (no breed), trained from day one.
  # Commons has no "Domestic long-haired cats"; "Long-haired cats" is the real one. Its
  # "Long-haired cats by breed" subcategory holds breeds one level further down, so keep
  # --depth at 1 or breed photos (Siberian, Turkish Van, ...) would be labelled domestic.
  - {id: domestic_cat, name: Domestic cat (no clear breed), species: cat, role: train, commons_categories: [Domestic short-haired cats, Long-haired cats]}

  # Cats: popular breeds Oxford doesn't have (Step 9f). They learn from Commons photos,
  # my licensed folders and the web sources; no Oxford test set for them.
  - {id: scottish_fold, name: Scottish Fold, species: cat, role: train, commons_categories: [Scottish Fold cats]}
  - {id: norwegian_forest_cat, name: Norwegian Forest Cat, species: cat, role: train, commons_categories: [Norwegian Forest Cats]}
  - {id: himalayan, name: Himalayan, species: cat, role: train, commons_categories: [Himalayan cats]}
  - {id: devon_rex, name: Devon Rex, species: cat, role: train, commons_categories: [Devon Rex]}
  - {id: siberian, name: Siberian, species: cat, role: train, commons_categories: [Siberian cats]}
  - {id: american_shorthair, name: American Shorthair, species: cat, role: train, commons_categories: [American Shorthair]}
  - {id: burmese, name: Burmese, species: cat, role: train, commons_categories: [Burmese cats]}
  - {id: cornish_rex, name: Cornish Rex, species: cat, role: train, commons_categories: [Cornish Rex]}
  - {id: oriental_shorthair, name: Oriental Shorthair, species: cat, role: train, commons_categories: [Oriental Shorthair]}
  - {id: savannah, name: Savannah, species: cat, role: train, commons_categories: [Savannah cats]}

  # Cats: real breeds kept out of training, used only for the unknown-breed test.
  # Bombay is an Oxford breed moved here on purpose (I chose not to cover it).
  - {id: exotic_shorthair, name: Exotic Shorthair, species: cat, role: unknown, commons_categories: [Exotic Shorthair cats]}
  - {id: turkish_angora, name: Turkish Angora, species: cat, role: unknown, commons_categories: [Turkish Angora]}
  - {id: chartreux, name: Chartreux, species: cat, role: unknown, commons_categories: [Chartreux]}
  - {id: turkish_van, name: Turkish Van, species: cat, role: unknown, commons_categories: [Turkish Van]}
  - {id: korat, name: Korat, species: cat, role: unknown, commons_categories: [Korat]}
  - {id: selkirk_rex, name: Selkirk Rex, species: cat, role: unknown, commons_categories: [Selkirk Rex]}
  - {id: manx, name: Manx, species: cat, role: unknown, commons_categories: [Manx cats]}

  # Dogs: the 25 Oxford breeds
  - {id: american_bulldog, name: American Bulldog, species: dog, role: train, oxford_label: american_bulldog}
  - {id: american_pit_bull_terrier, name: American Pit Bull Terrier, species: dog, role: train, oxford_label: american_pit_bull_terrier}
  - {id: basset_hound, name: Basset Hound, species: dog, role: train, oxford_label: basset_hound}
  - {id: beagle, name: Beagle, species: dog, role: train, oxford_label: beagle}
  - {id: boxer, name: Boxer, species: dog, role: train, oxford_label: boxer}
  - {id: chihuahua, name: Chihuahua, species: dog, role: train, oxford_label: chihuahua}
  - {id: english_cocker_spaniel, name: English Cocker Spaniel, species: dog, role: train, oxford_label: english_cocker_spaniel}
  - {id: english_setter, name: English Setter, species: dog, role: train, oxford_label: english_setter}
  - {id: german_shorthaired, name: German Shorthaired Pointer, species: dog, role: train, oxford_label: german_shorthaired}
  - {id: great_pyrenees, name: Great Pyrenees, species: dog, role: train, oxford_label: great_pyrenees}
  - {id: havanese, name: Havanese, species: dog, role: train, oxford_label: havanese}
  - {id: japanese_chin, name: Japanese Chin, species: dog, role: train, oxford_label: japanese_chin}
  - {id: keeshond, name: Keeshond, species: dog, role: train, oxford_label: keeshond}
  - {id: leonberger, name: Leonberger, species: dog, role: train, oxford_label: leonberger}
  - {id: miniature_pinscher, name: Miniature Pinscher, species: dog, role: train, oxford_label: miniature_pinscher}
  - {id: newfoundland, name: Newfoundland, species: dog, role: train, oxford_label: newfoundland}
  - {id: pomeranian, name: Pomeranian, species: dog, role: train, oxford_label: pomeranian}
  - {id: pug, name: Pug, species: dog, role: train, oxford_label: pug}
  - {id: saint_bernard, name: Saint Bernard, species: dog, role: train, oxford_label: saint_bernard}
  - {id: samoyed, name: Samoyed, species: dog, role: train, oxford_label: samoyed}
  - {id: scottish_terrier, name: Scottish Terrier, species: dog, role: train, oxford_label: scottish_terrier}
  - {id: shiba_inu, name: Shiba Inu, species: dog, role: train, oxford_label: shiba_inu}
  - {id: staffordshire_bull_terrier, name: Staffordshire Bull Terrier, species: dog, role: train, oxford_label: staffordshire_bull_terrier}
  - {id: wheaten_terrier, name: Soft-coated Wheaten Terrier, species: dog, role: train, oxford_label: wheaten_terrier}
  - {id: yorkshire_terrier, name: Yorkshire Terrier, species: dog, role: train, oxford_label: yorkshire_terrier}

  # Dogs: popular breeds Oxford doesn't have (Step 9f), from Commons, Openverse and my
  # licensed folders.
  - {id: golden_retriever, name: Golden Retriever, species: dog, role: train, commons_categories: [Golden Retrievers]}
  - {id: german_shepherd, name: German Shepherd, species: dog, role: train, commons_categories: [German Shepherds]}
  - {id: french_bulldog, name: French Bulldog, species: dog, role: train, commons_categories: [French Bulldogs]}
  - {id: poodle, name: Poodle, species: dog, role: train, commons_categories: [Poodles]}

  # Dogs I mark "mixed / no clear breed" in the Review tab. Never trained on; they join
  # the unknown-breed test, so the dog side gets a rejection rate like the cats.
  - {id: mixed_dog, name: Mixed / no clear breed, species: dog, role: unknown}

# Pairs the UI names together when their scores are close (DATASET.md).
close_pairs:
  - [bengal, egyptian_mau]
  - [birman, ragdoll]
  - [british_shorthair, russian_blue]
  - [american_pit_bull_terrier, staffordshire_bull_terrier]
  - [himalayan, persian]
  - [scottish_fold, british_shorthair]
  - [norwegian_forest_cat, maine_coon]
  - [norwegian_forest_cat, siberian]
  - [devon_rex, cornish_rex]
  - [oriental_shorthair, siamese]
