# dbt marts over the operational tables and the evaluation tables (Step 10).
# make dbt runs `dbt build` against the DATABASE_URL Postgres (see profiles.yml).
name: petlens
version: "1.0.0"
config-version: 2
profile: petlens

model-paths: [models]
snapshot-paths: [snapshots]
macro-paths: [macros]
target-path: target
clean-targets: [target, dbt_packages]

models:
  petlens:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: incremental
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
